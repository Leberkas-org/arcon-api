type: object
required:
  - tenantName
  - invitedByEmail
  - role
  - expiresAt
properties:
  tenantName:
    type: string
    example: "Leberkas Gaming"
    description: Name of the tenant the invite is for
  invitedByEmail:
    type: string
    format: email
    description: Email of the person who created the invite
  role:
    type: string
    enum:
      - admin
      - member
  expiresAt:
    type: string
    format: date-time
