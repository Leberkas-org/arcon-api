type: object
required:
  - id
  - email
  - tenants
properties:
  id:
    type: string
    format: uuid
    description: User ID (from JWT sub claim)
  email:
    type: string
    format: email
  tenants:
    type: array
    items:
      $ref: "index.yml#/TenantSummary"
    description: Tenants the user is a member of, with their role in each
