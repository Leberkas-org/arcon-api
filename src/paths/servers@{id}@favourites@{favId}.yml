put:
  tags:
    - favourites
  summary: Update a favourite
  description: Update a favourite. Users can update their own, admins can update any.
  operationId: updateFavourite
  security:
    - bearer_auth: []
  parameters:
    - $ref: "../api.yml#/components/parameters/TenantId"
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: favId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/index.yml#/FavouriteUpdate"
  responses:
    '200':
      description: Favourite updated
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Favourite"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Favourite not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
delete:
  tags:
    - favourites
  summary: Delete a favourite
  description: Delete a favourite. Users can delete their own, admins can delete any.
  operationId: deleteFavourite
  security:
    - bearer_auth: []
  parameters:
    - $ref: "../api.yml#/components/parameters/TenantId"
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: favId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Favourite deleted
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Favourite not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
