get:
  tags:
    - catalogs
  summary: List tenant catalogs
  description: List command catalogs scoped to this tenant.
  operationId: listTenantCatalogs
  security:
    - bearer_auth: []
  parameters:
    - name: id
      in: path
      description: Tenant ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of tenant catalogs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/index.yml#/Catalog"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Not a member of this tenant
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
post:
  tags:
    - catalogs
  summary: Create a tenant catalog
  description: |
    Upload a custom command catalog YAML file for this tenant. Admin or owner only.
    Returns 202 Accepted. The catalog is validated asynchronously.
    Poll GET /tenants/{id}/catalogs/{slug} to check the validation status.
  operationId: createTenantCatalog
  security:
    - bearer_auth: []
  parameters:
    - name: id
      in: path
      description: Tenant ID
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - slug
            - name
            - file
          properties:
            slug:
              type: string
              description: Unique identifier for the catalog
              pattern: "^[a-z0-9][a-z0-9-]*$"
            name:
              type: string
            description:
              type: string
            file:
              type: string
              format: binary
              description: Command catalog YAML file
  responses:
    '202':
      description: Upload accepted, validation in progress
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Catalog"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '409':
      description: Catalog with this slug already exists in this tenant
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
