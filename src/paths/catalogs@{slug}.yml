get:
  tags:
    - catalogs
  summary: Get a global catalog
  description: Get a global command catalog by slug.
  operationId: getGlobalCatalog
  security:
    - bearer_auth: []
  parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Catalog details
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Catalog"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Catalog not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
put:
  tags:
    - catalogs
  summary: Update a global catalog
  description: |
    Update a global command catalog. Platform admin only.
    If a new file is included, validation is triggered asynchronously (returns 202).
    If only metadata is updated, returns 200.
  operationId: updateGlobalCatalog
  security:
    - bearer_auth: []
  parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            file:
              type: string
              format: binary
              description: New command catalog YAML file. Triggers re-validation.
  responses:
    '200':
      description: Metadata updated (no new file)
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Catalog"
    '202':
      description: New file uploaded, validation in progress
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Catalog"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Platform admin required
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Catalog not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
delete:
  tags:
    - catalogs
  summary: Delete a global catalog
  description: Delete a global command catalog. Platform admin only.
  operationId: deleteGlobalCatalog
  security:
    - bearer_auth: []
  parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Catalog deleted
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Platform admin required
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Catalog not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
