get:
  tags:
    - history
  summary: Get command history
  description: List previously executed commands on this server. Paginated and filterable.
  operationId: getCommandHistory
  security:
    - bearer_auth: []
  parameters:
    - $ref: "../api.yml#/components/parameters/TenantId"
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        default: 20
    - name: userId
      in: query
      description: Filter by user who executed the command
      schema:
        type: string
        format: uuid
    - name: command
      in: query
      description: Filter by command name
      schema:
        type: string
    - name: from
      in: query
      description: Filter from this date (inclusive)
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      description: Filter to this date (inclusive)
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: Command history
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../schemas/index.yml#/PaginatedResponse"
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/index.yml#/HistoryEntry"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
