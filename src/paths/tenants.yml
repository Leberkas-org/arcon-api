get:
  tags:
    - tenants
  summary: List tenants
  description: List all tenants the current user is a member of.
  operationId: listTenants
  security:
    - bearer_auth: []
  responses:
    '200':
      description: List of tenants
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/index.yml#/Tenant"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
post:
  tags:
    - tenants
  summary: Create a tenant
  description: Create a new tenant. The authenticated user becomes the owner.
  operationId: createTenant
  security:
    - bearer_auth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/index.yml#/TenantCreate"
  responses:
    '201':
      description: Tenant created
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Tenant"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
