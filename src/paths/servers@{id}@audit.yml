get:
  tags:
    - audit
  summary: Get server audit log
  description: Query audit log entries for a specific server. Admin or owner only. Paginated and filterable.
  operationId: getServerAuditLog
  security:
    - bearer_auth: []
  parameters:
    - $ref: "../api.yml#/components/parameters/TenantId"
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        default: 20
    - name: userId
      in: query
      description: Filter by user who performed the action
      schema:
        type: string
        format: uuid
    - name: action
      in: query
      description: Filter by action type
      schema:
        type: string
        enum:
          - command.executed
          - command.replayed
          - server.created
          - server.updated
          - server.deleted
          - role.created
          - role.updated
          - role.deleted
          - member.invited
          - member.removed
          - member.updated
          - permission.updated
          - favourite.shared
    - name: from
      in: query
      description: Filter from this date (inclusive)
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      description: Filter to this date (inclusive)
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: Server audit log
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../schemas/index.yml#/PaginatedResponse"
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/index.yml#/AuditEntry"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '403':
      description: Forbidden - admin or owner required
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: "../schemas/index.yml#/Error"
